<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Anek+Devanagari:wght@500;600;700;800&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div class="uw uw-ambient" style="padding:28px">
<img class="uw-ambient-img" src="/_blob/d92196babc451f35082422630b8afd40" alt="">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:880px;align-items:start">
<div class="uw-glass uw-glass--compact uw-stack">
<span class="uw-label">You finished ending A</span>
<h3 class="uw-heading">There is another way this goes.</h3>
<div class="uw-verdict uw-verdict--b"><span class="uw-verdict-letter">B</span><span class="uw-verdict-text"><span lang="hi">चुपचाप पीछा करो</span><small>3 episodes · only open on day 1</small></span></div>
<span class="uw-chip uw-chip--alert" style="align-self:flex-start">Closes in 02:14:09</span>
<button type="button" class="uw-btn uw-btn--primary uw-btn--block"><svg viewBox="0 0 24 24" aria-hidden="true"><path style="fill:currentColor;stroke:none" d="M7 4.8a1 1 0 0 1 1.5-.85l11.7 7.2a1 1 0 0 1 0 1.7L8.5 20.05A1 1 0 0 1 7 19.2z"/></svg>Watch the other ending</button>
<button type="button" class="uw-btn uw-btn--glass uw-btn--block">Not now</button>
</div>
<div class="uw-glass uw-glass--compact uw-stack">
<span class="uw-label">You have seen both endings</span>
<h3 class="uw-heading">Keep your ballot, or move it?</h3>
<div class="uw-verdict"><span class="uw-verdict-letter">A</span><span class="uw-verdict-text"><span lang="hi">सच बता दो</span><small>Your ballot is here</small></span></div>
<div class="uw-tally"><div class="uw-tally-row"><span>A · 58%</span><span>42% · B</span></div><div class="uw-tally-bar" aria-hidden="true"><i style="width:58%"></i><i></i></div></div>
<button type="button" class="uw-btn uw-btn--ink uw-btn--block">Keep my ballot on A</button>
<button type="button" class="uw-btn uw-btn--glass uw-btn--block">Move my ballot to B</button>
<p class="uw-caption">You can move it once. The leading ending becomes official on day 2.</p>
</div>
</div>
</div>
</body>
</html>
