<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Anek+Devanagari:wght@500;600;700;800&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div class="uw uw-ambient" style="padding:28px">
<img class="uw-ambient-img" src="/_blob/d92196babc451f35082422630b8afd40" alt="">
<div class="uw-drawer" style="margin-left:auto">
<div class="uw-drawer-head"><span class="uw-label">Presenter controls</span><button type="button" class="uw-btn uw-btn--glass uw-btn--icon" aria-label="Close controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<div class="uw-field"><span class="uw-field-label" id="dd-day">Demo clock</span><div class="uw-seg uw-seg--full" role="group" aria-labelledby="dd-day"><button type="button" aria-pressed="true">Day 1</button><button type="button" aria-pressed="false">Last hour</button><button type="button" aria-pressed="false">Day 2</button></div></div>
<div class="uw-field"><span class="uw-field-label" id="dd-win">Winning ending</span><div class="uw-seg uw-seg--full" role="group" aria-labelledby="dd-win"><button type="button" aria-pressed="false">A</button><button type="button" aria-pressed="false">B</button><button type="button" aria-pressed="true">By votes</button></div></div>
<div class="uw-field"><span class="uw-field-label" id="dd-view">Viewer</span><div class="uw-seg uw-seg--full" role="group" aria-labelledby="dd-view"><button type="button" aria-pressed="true">New</button><button type="button" aria-pressed="false">Voted</button><button type="button" aria-pressed="false">Seen both</button></div></div>
<button type="button" class="uw-btn uw-btn--glass uw-btn--block"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4.5V9h4.5"/></svg>Reset this viewer</button>
<p class="uw-caption">Only visible in the demo. Changes apply to this device.</p>
</div>
</div>
</body>
</html>
